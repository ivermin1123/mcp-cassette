name: Bug report
description: Something in mcp-cassette doesn't work the way it should
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste cassettes or logs that contain
        real tokens or personal data — a recording is a faithful transcript of a
        real session, so redact before pasting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran. A minimal server command or cassette helps a lot.
      placeholder: |
        1. mcp-cassette record -o session.cassette.jsonl -- npx -y my-server
        2. mcp-cassette check --stdio "mcp-cassette replay session.cassette.jsonl"
        3. ...
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - record
        - replay
        - check
        - snapshot
        - other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-cassette version
      description: Output of `mcp-cassette --version`
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      description: Output of `node --version`, plus your operating system
      placeholder: v22.11.0 on macOS 15
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages or command output. Redact any secrets.
      render: shell
    validations:
      required: false
