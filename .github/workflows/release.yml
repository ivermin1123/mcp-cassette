name: Release

on:
  push:
    tags: ['v*']
  # Re-run `verify-publish` alone against a version that is already on npm.
  # Release infrastructure that can only be exercised by cutting a release is
  # infrastructure nobody can fix safely: the v0.2.0 job shipped two defects
  # that a single dry run would have caught. This dispatch reads the registry
  # and nothing else. The publish job below is gated off, so no dispatch can
  # publish, tag, or touch OIDC.
  workflow_dispatch:
    inputs:
      version:
        description: 'A version already published to npm, e.g. 0.2.0. Verifies only; never publishes.'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: publish to npm and create the GitHub Release
    # A tag push is the only thing that may publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v7

      # No `registry-url`: it makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc
      # unconditionally. With no token set, which is the intended state for trusted
      # publishing, that expands to an empty string, npm reads it as "auth is
      # already configured", never performs the OIDC exchange, and the publish
      # dies with ENEEDAUTH or E404 (npm/cli#8513, still open). Without the
      # option no .npmrc is written and npm falls back to its default registry,
      # which is registry.npmjs.org anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22.x bundles npm 10.9.x,
      # which has no OIDC support at all. Pinned rather than `@latest` so a new
      # npm major cannot land in the release path unannounced.
      - name: Install an npm that speaks OIDC
        run: |
          npm install -g npm@11.19.0
          npm --version

      - run: npm ci

      # Guard against tagging v0.2.0 while package.json still says 0.1.0.
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "releasing version $pkg"

      - run: npm test

      # Authentication is the OIDC exchange against the trusted publisher
      # configured for this package on npm: no token, no secret, nothing to
      # rotate or leak. `prepublishOnly` rebuilds and re-tests before the
      # tarball is created.
      #
      # Trusted publishing attaches provenance on its own, but the flag stays:
      # it turns a missing OIDC context into a loud failure instead of a
      # quietly unattested tarball.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `uses: ivermin1123/mcp-cassette@v0` resolves a *tag*, not a range, so
      # without this step the action freezes at whatever v0 pointed to when it
      # was first cut and no consumer ever sees an update. Moving a floating
      # tag onto each release is how GitHub's own actions are distributed, and
      # it is what makes the short forms in the README honest.
      #
      # Two floats, because one is not enough to express the promise. While the
      # major version is 0 a minor may break, so `@v0` cannot be recommended to
      # anyone who does not want that: on 0.3.0 it carried eight new lint rules
      # onto servers nobody had touched. `@v0.<minor>` is the pin the README
      # recommends, because it only ever gains patches, and `@v0` remains for people
      # who want every release and have said so.
      #
      # Last on purpose: this runs only once npm and the GitHub Release have
      # both succeeded, so neither float can point at a version that failed to
      # ship.
      - name: Move the floating major and minor tags
        run: |
          set -euo pipefail
          # A prerelease must not become what either float resolves to. Checked
          # before the names are derived, because `%.*` on v0.4.0-rc.1 yields
          # `v0.4.0-rc`, a string that is nobody's float and should not appear
          # in a log line either.
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease $GITHUB_REF_NAME — leaving the floats where they are"; exit 0 ;;
          esac
          # v0.3.0 -> v0 and v0.3 ; both keep working unchanged at v1 and beyond.
          MAJOR="${GITHUB_REF_NAME%%.*}"
          MINOR="${GITHUB_REF_NAME%.*}"
          # Lightweight on purpose: no committer identity needed, and the tag
          # these point at carries the real release metadata.
          for float in "$MAJOR" "$MINOR"; do
            git tag -f "$float" "$GITHUB_SHA"
            git push -f origin "refs/tags/$float"
            echo "$float now points at $GITHUB_REF_NAME ($GITHUB_SHA)"
          done

  # Everything above proves the tarball builds and tests green *here*. This job
  # proves the artifact that actually reached consumers works *there*: a clean
  # runner, no checkout on the module path, no node_modules, nothing but what
  # `npx` pulls from the registry. It catches the failure mode local CI cannot
  # see: a bad `files` list, a missing shebang or bin bit, a dependency that
  # only ever resolved because it was hoisted in this repo.
  #
  # It runs after publish because it can only run after publish, which is the
  # whole point: the window where a broken release is still cheap to blunt with
  # `npm deprecate` is measured in minutes, and nobody watches a registry they
  # were not told to look at.
  #
  # A failure here goes red and stops. It does NOT unpublish, deprecate, or
  # move any tag back. An automated rollback of a release the world may
  # already have installed is a worse outcome than a loud alert. Read the log,
  # then decide.
  verify-publish:
    name: verify the published package from npm
    needs: release
    # On a tag push this gates on the publish having succeeded. On a dispatch
    # `release` is skipped, and `needs` alone would skip this too, hence the
    # explicit result check rather than a bare `needs:`.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # For tests/fixtures/tiny-server.mjs and the action definition. The CLI
      # under test comes from the registry, never from this checkout.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      # The tag names the version on a release; a dispatch says so directly.
      # The value ends up in an npx specifier and a directory name, so it is
      # validated rather than trusted.
      - name: Resolve the released version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::not a usable version: '$version'"; exit 1 ;;
          esac
          echo "verifying mcp-cassette@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A publish is not instantly readable from every registry edge, so the
      # retry loop is not optional. What matters is *what* gets retried: this
      # used to be two steps (poll `npm view`, then assert with `npx`) and
      # those are different resolvers reading different caches. On the v0.2.0
      # release the poll went green on its first attempt and the very next line
      # died with `ETARGET No matching version found for mcp-cassette@0.2.0`,
      # on a package that had published perfectly (run 31925582059). A
      # readiness probe that does not exercise the command it is gating proves
      # nothing about that command, so the loop now wraps the real assertion
      # and there is exactly one resolver in this job.
      #
      # `--prefer-online` is the other half: it forces npm to revalidate the
      # cached packument rather than trust a copy it may have fetched seconds
      # before the publish landed.
      #
      # A version *mismatch* is not retried. Unresolvable means "not propagated
      # yet"; resolvable-but-wrong means the tarball itself is wrong, and
      # waiting cannot fix that.
      #
      # Deliberately no `npm ci`, no global install, and run from an empty
      # directory: `npx pkg@<exact>` will happily run an already-present
      # binary of another version instead of the pin, observed locally, where
      # a global mcp-cassette@0.1.1 answered a `npx -y mcp-cassette@0.1.2
      # --version` with "0.1.1". A runner has neither, and this keeps it that
      # way, so a mismatch here means the tarball really is wrong.
      - name: The published CLI reports the tagged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 10); do
            if got="$(npx --prefer-online -y "mcp-cassette@$VERSION" --version)"; then
              echo "npx reported: $got (attempt $attempt)"
              if [ "$got" != "$VERSION" ]; then
                echo "::error::published CLI reports '$got' but the tag says '$VERSION'"
                exit 1
              fi
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt); retrying in 30s"
            sleep 30
          done
          echo "::error::mcp-cassette@$VERSION never became runnable from the registry"
          exit 1

      # `version:` is the released number, not `local`, so the action pulls its
      # CLI from the registry, the same path a consumer's workflow takes.
      # `comment` is off: a tag push has no pull request to comment on.
      #
      # This step is also the only place the action's registry path is ever
      # exercised against a checkout named `mcp-cassette`, which is what made
      # it the first to hit npx discarding the version pin. See action.yml.
      - name: The published action gates the fixture server
        uses: ./
        with:
          server-command: node tests/fixtures/tiny-server.mjs
          snapshot-file: tests/fixtures/tiny-server.snapshot.json
          version: ${{ steps.version.outputs.version }}
          fail-on: dangerous
          comment: 'false'
