name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the non-blocking smoke-canary job below reports upstream
    # reference-server drift even in a quiet week. Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds, so this also verifies the TypeScript build.
      # The seed is pinned here as well as in the source: a property failure in
      # CI has to be reproducible from the log, and the seed is the whole input.
      - run: npm test
        env:
          FAST_CHECK_SEED: '20260815'

  smoke:
    name: smoke (dogfood the CLI end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      # record -> replay -> snapshot against the official MCP reference server,
      # at the version pinned in the script. Any non-zero exit inside the
      # script fails the job (set -euo pipefail).
      - name: End-to-end smoke against the MCP reference server
        run: bash scripts/smoke.sh

  action:
    name: action (dogfood the composite action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The action posts one results comment. A pull request from a fork gets a
      # read-only token whatever this says; the action warns and stays green.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # `version: local` below runs this build rather than a published release,
      # so the action under test is the one in this commit.
      - run: npm run build

      - name: Gate a clean server against its committed snapshot
        uses: ./
        with:
          server-command: node tests/fixtures/tiny-server.mjs
          snapshot-file: tests/fixtures/tiny-server.snapshot.json
          version: local
          fail-on: dangerous

      # A gate that has only ever been seen passing is not known to be a gate.
      # TINY_V2 makes the fixture server remove a tool and add a required
      # parameter; the action must go red, and the job must go green because of
      # it.
      - name: Gate a drifted server (expected to fail)
        id: drift
        continue-on-error: true
        env:
          TINY_V2: '1'
        uses: ./
        with:
          server-command: node tests/fixtures/tiny-server.mjs
          snapshot-file: tests/fixtures/tiny-server.snapshot.json
          version: local
          comment: 'false'

      - name: Assert the gate fired
        env:
          OUTCOME: ${{ steps.drift.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the contract gate passed a breaking diff (outcome: $OUTCOME)"
            exit 1
          fi

  smoke-canary:
    name: smoke-canary (unpinned reference server, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Early warning about upstream drift, never a gate. mcp-cassette v0.1 only
    # speaks the classic MCP lifecycle, so a stateless-only reference-server
    # release would break this while our own code is fine. A failure here is a
    # signal to go look, not a reason to block a PR.
    # Do NOT add this job to the required status checks in branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Smoke against the latest reference server
        env:
          SERVER_PKG: '@modelcontextprotocol/server-everything@latest'
        run: bash scripts/smoke.sh
