name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds, so this also verifies the TypeScript build.
      - run: npm test

  smoke:
    name: smoke (dogfood the CLI end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      # record -> replay -> snapshot against the official MCP reference server.
      # Any non-zero exit inside the script fails the job (set -euo pipefail).
      - name: End-to-end smoke against the MCP reference server
        run: bash scripts/smoke.sh
