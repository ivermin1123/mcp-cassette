name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a PR stacked on another
  # PR's branch needs its own CI run, not "no checks reported".
  pull_request:
  schedule:
    # Weekly, so the non-blocking smoke-canary job below reports upstream
    # reference-server drift even in a quiet week. Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `pretest` builds, so this also verifies the TypeScript build.
      # The seed is pinned here as well as in the source: a property failure in
      # CI has to be reproducible from the log, and the seed is the whole input.
      - run: npm test
        env:
          FAST_CHECK_SEED: '20260815'

  # The safety lint reads text an attacker wrote. A pattern with catastrophic
  # backtracking would turn the job that inspects a hostile tool into a denial
  # of service against itself, so "these regexes look fine" is not the standard:
  # recheck decides it by analysis. It also fails when a rule matches with a
  # regex it never published, which is how a new pattern could otherwise slip
  # past the gate.
  regex:
    name: regex (every lint pattern proven free of blowup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Analyse every pattern in LINT_RULES
        run: node scripts/recheck-rules.mjs

  smoke:
    name: smoke (dogfood the CLI end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      # record -> replay -> snapshot against the official MCP reference server,
      # at the version pinned in the script. Any non-zero exit inside the
      # script fails the job (set -euo pipefail).
      - name: End-to-end smoke against the MCP reference server
        run: bash scripts/smoke.sh

  action:
    name: action (dogfood the composite action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The action posts one results comment. A pull request from a fork gets a
      # read-only token whatever this says; the action warns and stays green.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # `version: local` below runs this build rather than a published release,
      # so the action under test is the one in this commit.
      - run: npm run build

      - name: Gate a clean server against its committed snapshot
        uses: ./
        with:
          server-command: node tests/fixtures/tiny-server.mjs
          snapshot-file: tests/fixtures/tiny-server.snapshot.json
          version: local
          fail-on: dangerous

      # A gate that has only ever been seen passing is not known to be a gate.
      # TINY_V2 makes the fixture server remove a tool and add a required
      # parameter; the action must go red, and the job must go green because of
      # it.
      # TINY_V2 rides in the server command rather than in the step's `env:`,
      # so this does not depend on how a composite action inherits step
      # environment — the flag reaches the fixture the same way a consumer's
      # own wrapper command would.
      - name: Gate a drifted server (expected to fail)
        id: drift
        continue-on-error: true
        uses: ./
        with:
          server-command: env TINY_V2=1 node tests/fixtures/tiny-server.mjs
          snapshot-file: tests/fixtures/tiny-server.snapshot.json
          version: local
          comment: 'false'

      - name: Assert the gate fired
        env:
          OUTCOME: ${{ steps.drift.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the contract gate passed a breaking diff (outcome: $OUTCOME)"
            exit 1
          fi

  # The other half of `check --format sarif`. The suite already validates the
  # document against the OASIS schema; what it cannot prove is that GitHub
  # *accepts* it — a schema-valid SARIF can still be rejected for rules the
  # schema does not express. So this uploads a real document from a real run.
  #
  # Pull requests only, deliberately. Code scanning alerts uploaded from a PR
  # branch are scoped to that PR; uploading on push to main would leave six
  # permanent "prompt injection" alerts on the repository's Security tab, all of
  # them describing a fixture that exists to be poisoned.
  sarif:
    name: sarif (upload findings to code scanning)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The only permission the upload needs. A public repository needs nothing
      # enabled in Settings beyond this.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci
      - run: npm run build

      # TINY_EVIL makes the fixture serve a poisoned tool and a broken schema,
      # so the document carries real findings rather than an empty `results`.
      # `check` exits non-zero on error-level findings by design, and the file is
      # written before it does — the gate firing is the point, not a failure.
      - name: Scan the poisoned fixture
        continue-on-error: true
        run: |
          node dist/cli.js check \
            --stdio "env TINY_EVIL=1 node tests/fixtures/tiny-server.mjs" \
            --format sarif > mcp-cassette.sarif

      - name: Show what is about to be uploaded
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("mcp-cassette.sarif", "utf8"));
            const r = s.runs[0];
            console.log("driver:", r.tool.driver.name, r.tool.driver.version);
            console.log("rules:", r.tool.driver.rules.length, "results:", r.results.length);
            console.log("ruleIds:", r.results.map((x) => x.ruleId).join(", "));
          '

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcp-cassette.sarif
          # Keeps these results in their own bucket, so they never merge with
          # findings from another tool scanning the same commit.
          category: mcp-cassette

  smoke-canary:
    name: smoke-canary (unpinned reference server, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Early warning about upstream drift, never a gate. mcp-cassette v0.1 only
    # speaks the classic MCP lifecycle, so a stateless-only reference-server
    # release would break this while our own code is fine. A failure here is a
    # signal to go look, not a reason to block a PR.
    # Do NOT add this job to the required status checks in branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Smoke against the latest reference server
        env:
          SERVER_PKG: '@modelcontextprotocol/server-everything@latest'
        run: bash scripts/smoke.sh
