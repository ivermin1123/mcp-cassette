name: mcp-cassette contract gate
description: >-
  Health-check an MCP server, lint what it tells the model for poisoning, and
  gate schema drift against a contract snapshot.
author: Hoang Le

branding:
  icon: disc
  color: purple

inputs:
  server-command:
    description: >-
      Command that starts the MCP server on stdio, e.g. "node dist/server.js".
      Run any build step yourself before this action.
    required: true
  snapshot-file:
    description: Path to the committed contract snapshot.
    required: false
    default: mcp-contract.snapshot.json
  mode:
    description: >-
      What to run: "check" (health + safety lint), "snapshot" (contract drift),
      or "both".
    required: false
    default: both
  fail-on:
    description: >-
      Lowest drift tier that fails the job: "breaking", or "dangerous" to also
      gate enum widening, default-value drift, added optional parameters, and a
      reworded description that trips a safety-lint rule the approved one did not.
    required: false
    default: breaking
  lint-fail-on:
    description: >-
      Lowest CAS-L safety-lint finding level that fails the job: "error", "warn"
      to also gate on the warn tier (the stricter setting), or "never" to keep
      the lint reporting without gating on it. "never" covers the description
      lint only: the check still runs, its findings still reach the log and the
      pull-request comment, and the job still fails on a structural CAS-C error
      (a duplicate tool name, an invalid inputSchema) or on a server that cannot
      be inspected at all.
    required: false
    default: error
  sarif-file:
    description: >-
      Write the check's findings, CAS-C and CAS-L alike, as SARIF 2.1.0 to this
      path, for a later github/codeql-action/upload-sarif step. A parent
      directory that does not exist is created. Empty (the default) writes
      nothing.
      Findings are anchored to the contract snapshot named by snapshot-file when
      that file exists, because code scanning discards a result that carries no
      physical location. Setting this starts the server a second time: the job
      log and the comment need the human-readable run. This action never
      uploads; uploading needs security-events write, which an action should not
      assume on its caller's behalf.
    required: false
    default: ''
  comment:
    description: >-
      Post (and afterwards update in place) a single results comment on the pull
      request. Ignored outside pull-request events.
    required: false
    default: 'true'
  version:
    description: >-
      Version of mcp-cassette to run from npm. The special value "local" runs
      the CLI built in this action's own checkout, which is how this repository
      dogfoods the action against itself; it is not useful to consumers.
    required: false
    default: 0.10.0
  github-token:
    description: >-
      Token used to write the pull-request comment. Needs `pull-requests: write`.
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: >-
      Path the SARIF document was written to, or empty when sarif-file was unset
      or the check produced no document. Guard the upload step on this output:
      an empty value is not the same as an unset input to the step that reads
      it.
    value: ${{ steps.check.outputs.sarif-file }}

runs:
  using: composite
  steps:
    # Inputs reach the shell through the environment, never through ${{ }}
    # interpolation: a server command is arbitrary text, and interpolating it
    # into a script body would let it run as script.
    - name: Resolve the CLI and validate inputs
      id: setup
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FAIL_ON: ${{ inputs.fail-on }}
        LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        COMMENT: ${{ inputs.comment }}
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        case "$MODE" in
          check|snapshot|both) ;;
          *) echo "::error::mode must be check, snapshot or both (got '$MODE')"; exit 1 ;;
        esac
        case "$FAIL_ON" in
          breaking|dangerous) ;;
          *) echo "::error::fail-on must be breaking or dangerous (got '$FAIL_ON')"; exit 1 ;;
        esac
        case "$LINT_FAIL_ON" in
          error|warn|never) ;;
          *) echo "::error::lint-fail-on must be error, warn or never (got '$LINT_FAIL_ON')"; exit 1 ;;
        esac
        case "$COMMENT" in
          true|false) ;;
          *) echo "::error::comment must be true or false (got '$COMMENT')"; exit 1 ;;
        esac

        case "$VERSION" in
          ''|*[!0-9A-Za-z.+-]*) echo "::error::version must be 'local' or a version string (got '$VERSION')"; exit 1 ;;
        esac

        if [ "$VERSION" = "local" ]; then
          CLI_BIN="$ACTION_PATH/dist/cli.js"
          if [ ! -f "$CLI_BIN" ]; then
            echo "::error::version 'local' needs a built CLI at $CLI_BIN, run 'npm run build' first"
            exit 1
          fi
          echo "cli=node $CLI_BIN" >> "$GITHUB_OUTPUT"
        else
          # npx resolves a package against the *local project* before the
          # registry, and a bare name match is enough: from a checkout of
          # mcp-cassette itself, this package.json's `bin.mcp-cassette` makes
          # npx discard the `@$VERSION` pin entirely. On a runner with no
          # node_modules that is `sh: 1: mcp-cassette: not found` (exit 127);
          # on a machine that has a stale build it is worse: the wrong
          # version answers and exits 0, so a release nobody tested reads as
          # verified.
          #
          # `--prefix` moves where the CLI is *resolved* without moving the
          # process cwd, so `server-command` and `snapshot-file` still resolve
          # against the caller's checkout. Those two directories are separate
          # on purpose and must not be collapsed back into one.
          #
          # Harmless for consumers, whose repo is not named mcp-cassette, but
          # it is exactly how this repo dogfoods the action against its own
          # published tarball in the release workflow's verify-publish job.
          CLI_PREFIX="$RUNNER_TEMP/mcp-cassette-cli-$VERSION"
          mkdir -p "$CLI_PREFIX"
          echo "cli=npx --prefer-online --prefix $CLI_PREFIX -y mcp-cassette@$VERSION" >> "$GITHUB_OUTPUT"
        fi

    # `check` and `snapshot` record their exit codes instead of aborting: the
    # comment is the point of this action, and a job that dies before writing it
    # reports drift only to whoever opens the raw log. The gate step at the end
    # turns those codes back into a job result.
    #
    # `set +e` is what makes that true, and it is not decoration. Actions runs
    # every `shell: bash` step as `bash --noprofile --norc -eo pipefail {0}`, so
    # `-e` is already on before the first line of this script, and a `set -uo
    # pipefail` line does not clear it: `set` only turns options on. Without the
    # `+e` these steps died on the failing command, the `status=` line below
    # never ran, and the Report and Gate steps were skipped as dependents of a
    # failed step. The comment went missing in exactly the case it exists for.
    - name: Health + safety check
      id: check
      if: inputs.mode == 'check' || inputs.mode == 'both'
      shell: bash
      env:
        CLI: ${{ steps.setup.outputs.cli }}
        SERVER_COMMAND: ${{ inputs.server-command }}
        LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        SNAPSHOT_FILE: ${{ inputs.snapshot-file }}
      run: |
        set -uo pipefail
        set +e

        # The gate goes to the CLI rather than being applied to the exit code
        # here. Only `check` can tell a waived CAS-L finding from the two things
        # `never` must never hide: a structural CAS-C error, and a server that
        # could not be inspected at all. From out here they are all exit 1 or 2.
        $CLI check --lint-fail-on "$LINT_FAIL_ON" --stdio "$SERVER_COMMAND" 2>&1 \
          | tee "$RUNNER_TEMP/mcp-cassette-check.log"
        STATUS=${PIPESTATUS[0]}

        if [ -n "$SARIF_FILE" ]; then
          # A second run, because one invocation emits one format and both are
          # wanted: the text above is what the log and the comment show, this is
          # what code scanning ingests. The anchor is passed only when the
          # snapshot exists; naming a missing file is an error in the CLI, while
          # omitting the flag lets it fall back to its own resolution and warn.
          sarif_run() {
            if [ -f "$SNAPSHOT_FILE" ]; then
              $CLI check --lint-fail-on "$LINT_FAIL_ON" --stdio "$SERVER_COMMAND" \
                --format sarif --sarif-location "$SNAPSHOT_FILE"
            else
              $CLI check --lint-fail-on "$LINT_FAIL_ON" --stdio "$SERVER_COMMAND" --format sarif
            fi
          }
          # The redirect, not the CLI, creates the file, so a path under a
          # directory that does not exist fails before the run starts and
          # leaves nothing behind.
          mkdir -p "$(dirname "$SARIF_FILE")"
          sarif_run > "$SARIF_FILE" 2> "$RUNNER_TEMP/mcp-cassette-sarif.err"
          SARIF_STATUS=$?
          # The no-anchor warning lives here, and a consumer who never sees it
          # uploads a document code scanning accepts and then discards.
          cat "$RUNNER_TEMP/mcp-cassette-sarif.err" >&2 || true
          # A document exists only when the run reached its own exit at 0 or 1
          # and wrote something. A usage error from an older pinned release, an
          # uncaught exception, and a failed redirect all exit 1 too, and leave
          # an empty file or none at all; exit 2 means the server could not be
          # inspected or the anchor was rejected. Exposing the path in any of
          # those cases hands the upload step a file that is not SARIF.
          # Removing it and warning is better than a stub, and it stays a
          # warning: the text run above already decided the gate, and this must
          # not turn a passing job red on its own.
          if [ "$SARIF_STATUS" -ge 2 ] || [ ! -s "$SARIF_FILE" ]; then
            rm -f "$SARIF_FILE"
            echo "::warning::mcp-cassette wrote no SARIF (check exit $SARIF_STATUS), see the log above"
          else
            echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          fi
        fi

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

    - name: Contract drift
      id: snapshot
      if: inputs.mode == 'snapshot' || inputs.mode == 'both'
      shell: bash
      env:
        CLI: ${{ steps.setup.outputs.cli }}
        SERVER_COMMAND: ${{ inputs.server-command }}
        SNAPSHOT_FILE: ${{ inputs.snapshot-file }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        set +e
        if [ ! -f "$SNAPSHOT_FILE" ]; then
          echo "::error::no contract snapshot at $SNAPSHOT_FILE, create one with 'npx mcp-cassette snapshot --stdio \"<server>\"' and commit it"
          echo "status=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # --json goes to a file so the diff survives for the comment step; the
        # human-readable form is what shows up in the log.
        $CLI snapshot --check --json --fail-on "$FAIL_ON" -f "$SNAPSHOT_FILE" \
          --stdio "$SERVER_COMMAND" > "$RUNNER_TEMP/mcp-cassette-diff.json" 2> "$RUNNER_TEMP/mcp-cassette-diff.err"
        STATUS=$?
        cat "$RUNNER_TEMP/mcp-cassette-diff.err" >&2 || true
        if [ "$STATUS" -ge 2 ]; then
          echo "::error::snapshot --check could not run, see the log above"
        fi
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

    # One render, three destinations: the job log, the step summary, and, on a
    # pull request, a single comment that is edited in place on every re-run
    # rather than appended to.
    - name: Report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MODE: ${{ inputs.mode }}
        FAIL_ON: ${{ inputs.fail-on }}
        LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        SNAPSHOT_FILE: ${{ inputs.snapshot-file }}
        COMMENT: ${{ inputs.comment }}
        CHECK_STATUS: ${{ steps.check.outputs.status }}
        SNAPSHOT_STATUS: ${{ steps.snapshot.outputs.status }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
      run: node "$GITHUB_ACTION_PATH/scripts/contract-report.mjs"

    - name: Gate
      shell: bash
      env:
        CHECK_STATUS: ${{ steps.check.outputs.status }}
        SNAPSHOT_STATUS: ${{ steps.snapshot.outputs.status }}
      run: |
        set -euo pipefail
        FAILED=0
        if [ "${CHECK_STATUS:-0}" != "0" ]; then
          echo "::error::mcp-cassette check failed (exit ${CHECK_STATUS})"
          FAILED=1
        fi
        if [ "${SNAPSHOT_STATUS:-0}" != "0" ]; then
          echo "::error::mcp-cassette contract gate failed (exit ${SNAPSHOT_STATUS})"
          FAILED=1
        fi
        exit "$FAILED"
